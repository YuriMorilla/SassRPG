<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Fichas RPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="centered">
  <div class="panel auth-box">
    <h1 id="titulo">Entrar</h1>
    <div class="sub">Sistema de fichas e inventário para RPG de mesa</div>

    <div class="field" id="campo-nome" style="display:none">
      <label>Nome do personagem/jogador</label>
      <input id="nome" type="text" placeholder="Como te chamam na mesa">
    </div>

    <div class="field">
      <label>E-mail</label>
      <input id="email" type="email" placeholder="voce@exemplo.com">
    </div>

    <div class="field">
      <label>Senha</label>
      <input id="senha" type="password" placeholder="••••••••">
    </div>

    <button id="btn-acao" style="width:100%">Entrar</button>
    <div class="error" id="erro"></div>

    <div class="divider"></div>
    <div class="muted" style="text-align:center">
      <span id="troca-texto">Não tem conta?</span>
      <a href="#" id="troca-link">Cadastre-se</a>
    </div>
  </div>
</div>

<script type="module">
import {
  auth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, updateProfile, db, doc, setDoc, serverTimestamp
} from "./js/firebase-config.js";

let modoCadastro = false;

const $ = (id) => document.getElementById(id);

$("troca-link").addEventListener("click", (e) => {
  e.preventDefault();
  modoCadastro = !modoCadastro;
  $("campo-nome").style.display = modoCadastro ? "block" : "none";
  $("titulo").textContent = modoCadastro ? "Criar conta" : "Entrar";
  $("btn-acao").textContent = modoCadastro ? "Criar conta" : "Entrar";
  $("troca-texto").textContent = modoCadastro ? "Já tem conta?" : "Não tem conta?";
  $("troca-link").textContent = modoCadastro ? "Entrar" : "Cadastre-se";
  $("erro").textContent = "";
});

$("btn-acao").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const senha = $("senha").value;
  $("erro").textContent = "";

  if (!email || !senha) {
    $("erro").textContent = "Preencha e-mail e senha.";
    return;
  }

  try {
    if (modoCadastro) {
      const nome = $("nome").value.trim();
      if (!nome) { $("erro").textContent = "Informe seu nome."; return; }
      const cred = await createUserWithEmailAndPassword(auth, email, senha);
      await updateProfile(cred.user, { displayName: nome });
      await setDoc(doc(db, "usuarios", cred.user.uid), {
        nome, email, criadoEm: serverTimestamp()
      });
    } else {
      await signInWithEmailAndPassword(auth, email, senha);
    }
    window.location.href = "grupos.html";
  } catch (err) {
    $("erro").textContent = traduzErro(err.code);
  }
});

function traduzErro(code) {
  const mapa = {
    "auth/email-already-in-use": "Este e-mail já está cadastrado.",
    "auth/invalid-email": "E-mail inválido.",
    "auth/weak-password": "Senha muito curta (mínimo 6 caracteres).",
    "auth/invalid-credential": "E-mail ou senha incorretos.",
    "auth/user-not-found": "E-mail ou senha incorretos.",
    "auth/wrong-password": "E-mail ou senha incorretos.",
  };
  return mapa[code] || "Ocorreu um erro. Tente novamente.";
}

onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = "grupos.html";
});
</script>

</body>
</html>
