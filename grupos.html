<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Grupos — Fichas RPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">Fichas RPG</div>
  <div class="userinfo">
    <span id="nome-usuario"></span>
    <button class="secondary" id="btn-sair">Sair</button>
  </div>
</div>

<div class="wrap">
  <h1>Meus Grupos</h1>
  <p class="muted">Cada grupo é uma campanha separada. Crie um grupo para ser o mestre, ou entre em um com o código de convite.</p>

  <div class="grid grid-2">
    <div class="panel">
      <h3>Criar novo grupo</h3>
      <div class="field">
        <label>Nome da campanha</label>
        <input id="nome-grupo" placeholder="Ex: A Torre Sombria">
      </div>
      <button id="btn-criar">Criar grupo (serei o mestre)</button>
      <div class="error" id="erro-criar"></div>
    </div>

    <div class="panel">
      <h3>Entrar em um grupo</h3>
      <div class="field">
        <label>Código de convite</label>
        <input id="codigo-entrar" placeholder="Ex: A3F9K2" style="text-transform:uppercase">
      </div>
      <button id="btn-entrar">Entrar como jogador</button>
      <div class="error" id="erro-entrar"></div>
    </div>
  </div>

  <div class="divider"></div>

  <div id="lista-grupos" class="grid grid-2">
    <div class="empty">Carregando grupos...</div>
  </div>
</div>

<script type="module">
import {
  auth, db, onAuthStateChanged, signOut,
  doc, getDoc, setDoc, collection, addDoc, query, where, getDocs, serverTimestamp
} from "./firebase-config.js";

const $ = (id) => document.getElementById(id);
let usuarioAtual = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "index.html"; return; }
  usuarioAtual = user;
  $("nome-usuario").textContent = user.displayName || user.email;
  carregarGrupos();
});

$("btn-sair").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "index.html";
});

function gerarCodigo() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

$("btn-criar").addEventListener("click", async () => {
  const nome = $("nome-grupo").value.trim();
  $("erro-criar").textContent = "";
  if (!nome) { $("erro-criar").textContent = "Dê um nome para a campanha."; return; }

  try {
    const codigo = gerarCodigo();
    const novoGrupo = await addDoc(collection(db, "grupos"), {
      nome,
      codigo,
      mestreId: usuarioAtual.uid,
      mestreNome: usuarioAtual.displayName || usuarioAtual.email,
      criadoEm: serverTimestamp()
    });
    await setDoc(doc(db, "grupos", novoGrupo.id, "membros", usuarioAtual.uid), {
      nome: usuarioAtual.displayName || usuarioAtual.email,
      papel: "mestre",
      entrouEm: serverTimestamp()
    });
    $("nome-grupo").value = "";
    carregarGrupos();
  } catch (err) {
    $("erro-criar").textContent = "Erro ao criar grupo: " + err.message;
  }
});

$("btn-entrar").addEventListener("click", async () => {
  const codigo = $("codigo-entrar").value.trim().toUpperCase();
  $("erro-entrar").textContent = "";
  if (!codigo) { $("erro-entrar").textContent = "Informe o código do grupo."; return; }

  try {
    const q = query(collection(db, "grupos"), where("codigo", "==", codigo));
    const snap = await getDocs(q);
    if (snap.empty) { $("erro-entrar").textContent = "Nenhum grupo encontrado com esse código."; return; }

    const grupoDoc = snap.docs[0];
    const membroRef = doc(db, "grupos", grupoDoc.id, "membros", usuarioAtual.uid);
    const membroSnap = await getDoc(membroRef);

    if (!membroSnap.exists()) {
      await setDoc(membroRef, {
        nome: usuarioAtual.displayName || usuarioAtual.email,
        papel: "jogador",
        entrouEm: serverTimestamp()
      });
      // cria a ficha vazia do personagem para esse jogador
      await setDoc(doc(db, "grupos", grupoDoc.id, "fichas", usuarioAtual.uid), fichaVazia(usuarioAtual.displayName || usuarioAtual.email));
    }

    $("codigo-entrar").value = "";
    carregarGrupos();
  } catch (err) {
    $("erro-entrar").textContent = "Erro ao entrar: " + err.message;
  }
});

function fichaVazia(nome) {
  return {
    nome,
    classe: "",
    nivel: 1,
    pv: 10, pvMax: 10,
    pm: 0, pmMax: 0,
    atributos: { forca: 10, destreza: 10, constituicao: 10, inteligencia: 10, sabedoria: 10, carisma: 10 },
    anotacoes: "",
    inventario: []
  };
}

async function carregarGrupos() {
  const lista = $("lista-grupos");
  lista.innerHTML = '<div class="empty">Carregando grupos...</div>';

  // busca todos os grupos e filtra os que o usuário é membro
  // (abordagem simples: consulta a subcoleção membros de cada grupo é cara;
  // por isso mantemos também uma coleção espelho "minhasParticipacoes")
  const q = query(collection(db, "grupos"));
  const snap = await getDocs(q);

  const grupos = [];
  for (const g of snap.docs) {
    const membroSnap = await getDoc(doc(db, "grupos", g.id, "membros", usuarioAtual.uid));
    if (membroSnap.exists()) {
      grupos.push({ id: g.id, ...g.data(), papel: membroSnap.data().papel });
    }
  }

  if (grupos.length === 0) {
    lista.innerHTML = '<div class="empty">Você ainda não participa de nenhum grupo.</div>';
    return;
  }

  lista.innerHTML = "";
  grupos.forEach((g) => {
    const div = document.createElement("div");
    div.className = "card clickable";
    div.innerHTML = `
      <div class="row between">
        <h3 style="margin:0">${escapeHtml(g.nome)}</h3>
        <span class="badge ${g.papel}">${g.papel}</span>
      </div>
      <p class="muted" style="margin:8px 0 0">Mestre: ${escapeHtml(g.mestreNome)}</p>
      ${g.papel === "mestre" ? `<p class="muted" style="margin:4px 0 0">Código de convite: <strong>${g.codigo}</strong></p>` : ""}
    `;
    div.addEventListener("click", () => {
      const destino = g.papel === "mestre" ? "mestre.html" : "jogador.html";
      window.location.href = `${destino}?grupo=${g.id}`;
    });
    lista.appendChild(div);
  });
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str ?? "";
  return d.innerHTML;
}
</script>

</body>
</html>
